name: Metrics

on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
  push: { branches: ['main'] }

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: TixXin
          filename: github-metrics.svg
          template: classic
          # 贡献日历主页已有原生版本，这里只保留“数字型”信息
          base: header, activity, community
          config_timezone: Asia/Singapore
          # 语言/仓库统计需要 PAT（github.token 只能看到当前仓库，会显示 0 Languages）。
          # 想启用时：建一个带 repo 权限的 PAT，存为仓库 secret METRICS_TOKEN，再取消下面注释。
          # repositories: 100
          # plugin_languages: yes
          # plugin_languages_details: lines, bytes-size
          # plugin_languages_limit: 6
          # plugin_languages_sections: most-used
